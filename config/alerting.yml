# Slack contact points, one per alert type so each can be routed and throttled
# independently (see config/notification_policies.yml).
#
# Message bodies always render {{ .Annotations.summary }}, which generate_alerts.py
# builds from the thresholds in config/alerts_config.json. Do not restate a
# threshold or a time window here: a hardcoded "90%" silently disagrees with the
# config the moment someone changes it.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-alerts-storage
    receivers:
      - uid: slack-alerts-storage
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: "{{ range .Alerts }}Storage Alert - {{ .Labels.hostname }} ({{ .Labels.device }}){{ end }}"
          text: "{{ range .Alerts }}⚠️ {{ .Annotations.summary }}{{ end }}"
        disableResolveMessage: false
  - orgId: 1
    name: slack-alerts-storage-projection
    receivers:
      - uid: slack-alerts-storage-projection
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: "{{ range .Alerts }}Storage Projection - {{ .Labels.hostname }} ({{ .Labels.device }}){{ end }}"
          text: "{{ range .Alerts }}📈 {{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}"
        disableResolveMessage: false
  - orgId: 1
    name: slack-alerts-system
    receivers:
      - uid: slack-alerts-system
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: "{{ range .Alerts }}{{ .Labels.alertname }} - {{ .Labels.hostname }}{{ end }}"
          text: "{{ range .Alerts }}⚠️ {{ .Annotations.summary }}{{ end }}"
        disableResolveMessage: false
  - orgId: 1
    name: slack-alerts-gpu
    receivers:
      - uid: slack-alerts-gpu
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: "{{ range .Alerts }}GPU Alert - {{ .Labels.alertname }} - {{ .Labels.hostname }}{{ end }}"
          text: "{{ range .Alerts }}🔥 {{ .Annotations.summary }}{{ end }}"
        disableResolveMessage: false
