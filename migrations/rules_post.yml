# Post-relabel era: mountpoints already correct, no normalisation.
groups:
  - name: backfill_physical_drives
    interval: 5m
    rules:
      - record: fs:physical:size_bytes
        expr: max by (hostname, device, mountpoint) (node_filesystem_size_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint!~"/rootfs($|/.*)"})
      - record: fs:physical:avail_bytes
        expr: max by (hostname, device, mountpoint) (node_filesystem_avail_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint!~"/rootfs($|/.*)"})
      - record: fs:physical:used_bytes
        expr: max by (hostname, device, mountpoint) (node_filesystem_size_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint!~"/rootfs($|/.*)"}) - on(hostname, device, mountpoint) max by (hostname, device, mountpoint) (node_filesystem_avail_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint!~"/rootfs($|/.*)"})
      - record: fs:physical:used_percent
        expr: 100 * (1 - max by (hostname, device, mountpoint) (node_filesystem_avail_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint!~"/rootfs($|/.*)"}) / on(hostname, device, mountpoint) max by (hostname, device, mountpoint) (node_filesystem_size_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint!~"/rootfs($|/.*)"}))
