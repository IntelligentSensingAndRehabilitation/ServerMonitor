# Pre-relabel era: /rootfs-prefixed mountpoints, normalised onto current names.
groups:
  - name: backfill_physical_drives
    interval: 5m
    rules:
      - record: fs:physical:size_bytes
        expr: max by (hostname, device, mountpoint) (label_replace(label_replace(node_filesystem_size_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint=~"/rootfs($|/.*)"}, "mountpoint", "$1", "mountpoint", "^/rootfs(/.+)$"), "mountpoint", "/", "mountpoint", "^/rootfs$"))
      - record: fs:physical:avail_bytes
        expr: max by (hostname, device, mountpoint) (label_replace(label_replace(node_filesystem_avail_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint=~"/rootfs($|/.*)"}, "mountpoint", "$1", "mountpoint", "^/rootfs(/.+)$"), "mountpoint", "/", "mountpoint", "^/rootfs$"))
      - record: fs:physical:used_bytes
        expr: max by (hostname, device, mountpoint) (label_replace(label_replace(node_filesystem_size_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint=~"/rootfs($|/.*)"}, "mountpoint", "$1", "mountpoint", "^/rootfs(/.+)$"), "mountpoint", "/", "mountpoint", "^/rootfs$")) - on(hostname, device, mountpoint) max by (hostname, device, mountpoint) (label_replace(label_replace(node_filesystem_avail_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint=~"/rootfs($|/.*)"}, "mountpoint", "$1", "mountpoint", "^/rootfs(/.+)$"), "mountpoint", "/", "mountpoint", "^/rootfs$"))
      - record: fs:physical:used_percent
        expr: 100 * (1 - max by (hostname, device, mountpoint) (label_replace(label_replace(node_filesystem_avail_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint=~"/rootfs($|/.*)"}, "mountpoint", "$1", "mountpoint", "^/rootfs(/.+)$"), "mountpoint", "/", "mountpoint", "^/rootfs$")) / on(hostname, device, mountpoint) max by (hostname, device, mountpoint) (label_replace(label_replace(node_filesystem_size_bytes{fstype=~"ext4|ext3|xfs|btrfs|zfs",mountpoint!~"/(boot|snap|run|dev|proc|sys|var/lib|autofs)(|/.*)",mountpoint=~"/rootfs($|/.*)"}, "mountpoint", "$1", "mountpoint", "^/rootfs(/.+)$"), "mountpoint", "/", "mountpoint", "^/rootfs$")))
